name: CI

on:
  workflow_dispatch:
    inputs:
      refresh_snapshots:
        description: Generate native Linux browser baselines for review
        type: boolean
        default: false
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: wallet-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24.15.0'
          cache: pnpm
      - name: Frozen install
        run: corepack pnpm install --frozen-lockfile
      - name: Format
        run: corepack pnpm format:check
      - name: Lint
        run: corepack pnpm exec eslint "src/**/*.{ts,tsx,js,jsx}" --max-warnings=0
      - name: Type check
        run: corepack pnpm typecheck
      - name: Contract packs
        run: node scripts/verify-contract-packs.mjs
      - name: Unit tests
        run: corepack pnpm test:unit --maxWorkers=2 --exclude src/lib/vault/ledgerRecoveryWallet.test.ts --exclude src/lib/vault/recovery/portable.test.ts
      # Keep expensive complete recovery signatures on one worker to avoid CPU starvation.
      - name: Recovery signing tests
        run: corepack pnpm exec vitest run src/lib/vault/ledgerRecoveryWallet.test.ts src/lib/vault/recovery/portable.test.ts --maxWorkers=1
      - name: Reject ambiguous builds
        run: node scripts/verify-release-build.mjs
      - name: Build vault
        run: |
          corepack pnpm build:mutinynet
          corepack pnpm build:mainnet
      - name: Verify compiled mainnet policy
        run: |
          corepack pnpm exec playwright install --with-deps chromium
          node scripts/verify-mainnet-build.mjs
      - name: Production audit
        run: corepack pnpm audit --prod

  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24.15.0'
          cache: pnpm
      - name: Frozen install
        run: corepack pnpm install --frozen-lockfile
      - name: Install Playwright system dependencies
        run: corepack pnpm exec playwright install-deps chromium webkit
      - name: Cache Playwright browsers
        uses: actions/cache@v6
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-vault-browsers-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install Playwright
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: corepack pnpm exec playwright install chromium webkit
      - name: Vault Playwright
        run: corepack pnpm test:e2e ${{ inputs.refresh_snapshots && '--update-snapshots=all' || '' }}
        env:
          CI: true
          VAULT_UPDATE_SNAPSHOTS: ${{ inputs.refresh_snapshots && '1' || '0' }}

      - name: Lightning and denomination UX in Chromium and Safari
        run: corepack pnpm test:ux ${{ inputs.refresh_snapshots && '--update-snapshots=all' || '' }}

      - name: Browser failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-failure-screenshots
          path: test-results/**/*.png
          retention-days: 7
          if-no-files-found: ignore

      - name: Native Linux screenshot baselines
        if: success() && inputs.refresh_snapshots
        uses: actions/upload-artifact@v4
        with:
          name: linux-screenshot-baselines
          path: src/test/e2e-vault/**/*-linux.png
          retention-days: 7
